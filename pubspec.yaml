name: myapp
description: LingoBlob teaches six languages with lessons, flashcards and speaking practice.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.18.3
  google_fonts: ^9.0.0
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: 23.0.1
  flutter_timezone: 5.1.1
  timezone: 0.11.2
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  speech_to_text: ^7.5.0
  path_provider: ^2.1.6
  crypto: ^3.0.8
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
  assets:
    - assets/courses/japanese_basics.json
    - assets/courses/spanish_basics.json
    - assets/courses/french_basics.json
    - assets/courses/german_basics.json
    - assets/courses/italian_basics.json
    - assets/courses/portuguese_basics.json
    - assets/fonts/
    - assets/local/
    - assets/audio/
