name: myapp
description: A language-learning app, built phase by phase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.18.3
  google_fonts: ^9.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/courses/japanese_basics.json
    - assets/fonts/
